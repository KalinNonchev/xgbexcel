name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a breaking XGBoost or NumPy release surfaces here rather than in
    # a user's spreadsheet.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip ruff
      - name: Lint
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check --diff .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Show resolved versions
        run: python -c "import xgboost, numpy; print('xgboost', xgboost.__version__, 'numpy', numpy.__version__)"
      - name: Test
        run: pytest --cov=xgbexcel --cov-branch --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  xgboost-versions:
    # The converter reads XGBoost's serialised model, so its layout matters. Pin the
    # boundaries of the supported range and also test the unreleased build.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        xgboost: ["1.7.6", "2.0.3", "2.1.4", "3.0.0", "latest", "pre"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - name: Install XGBoost ${{ matrix.xgboost }}
        run: |
          if [ "${{ matrix.xgboost }}" = "latest" ]; then
            python -m pip install --upgrade xgboost
          elif [ "${{ matrix.xgboost }}" = "pre" ]; then
            python -m pip install --upgrade --pre xgboost
          else
            python -m pip install "xgboost==${{ matrix.xgboost }}"
          fi
      - run: python -c "import xgboost; print('xgboost', xgboost.__version__)"
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - name: Check metadata
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
